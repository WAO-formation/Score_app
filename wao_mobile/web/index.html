<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WAO — World Oneness Through Sport">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WAO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WAO</title>
  <link rel="manifest" href="manifest.json">

  <!-- Brand fonts, matching the WAO web app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root { --wao-primary: #C81434; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
    }

    /* Mirrors wao-web/src/components/LoadingScreen.jsx */
    #wao-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #ffffff;
      transition: opacity 0.5s ease, clip-path 0.6s cubic-bezier(0.76, 0, 0.24, 1);
    }

    #wao-splash.wao-hide {
      opacity: 0;
      pointer-events: none;
      clip-path: inset(0 0 100% 0);
    }

    #wao-splash img {
      height: 64px;
      width: auto;
    }

    #wao-splash .wao-bar {
      width: 160px;
      height: 2px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    #wao-splash .wao-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: var(--wao-primary);
      animation: wao-slide 1.1s ease-in-out infinite;
    }

    @keyframes wao-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }

    #wao-splash .wao-tagline {
      font-family: 'Oswald', system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.35);
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="wao-splash">
    <img src="wao_logo.png" alt="WAO">
    <div class="wao-bar"></div>
    <p class="wao-tagline">World Oneness Through Sport</p>
  </div>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function (engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function (appRunner) {
        return appRunner.runApp();
      });
    });

    // Wipe the brand splash once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('wao-splash');
      if (!splash) return;
      splash.classList.add('wao-hide');
      setTimeout(function () { splash.remove(); }, 700);
    });
  </script>
</body>
</html>
